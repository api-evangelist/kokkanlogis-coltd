name: KokkanLogis Co.,Ltd.
description: 'KokkanLogis Co.,Ltd. (주식회사 곳간, branded KOKKAN / 도심창고 곳간) is a South
  Korean urban self-storage and logistics operator headquartered in Gangnam-gu, Seoul.
  It rents managed storage units in five sizes (S, M, L, XL, XXL, from 1.0m cubes up
  to 2.0 x 2.0 x 2.0m) across 22 branches in Seoul, Busan, Incheon, Gyeonggi and Chungbuk,
  serving households storing seasonal appliances, clothing, bedding and baby goods
  as well as businesses storing samples, inventory, documents and office equipment.
  Customers select a branch, choose a unit size, pay and manage their contract through
  the KOKKAN mobile apps for iOS and Android, with recurring monthly card billing through
  a Korean payment gateway, long-term and promotional discounting, an address-rental
  (주소지 임대) product, and an optional pickup service for moving stored goods. The company
  also runs a franchise and partnership program for operators who want to open a KOKKAN
  branch. It was surfaced through the 500 Global portfolio. As of this profile KokkanLogis
  publishes no public API, developer portal, SDK or technical documentation — the product
  surface is a consumer website plus native mobile apps.'
